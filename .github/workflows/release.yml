name: Release

# Publishes to npm whenever a version tag (vX.Y.Z) is pushed.
# Auth: npm Trusted Publishing (OIDC) — no token needed. Provenance is automatic.
# Flow: `npm version patch|minor|major` on main → tag is pushed → this runs.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm
      # Trusted publishing (OIDC) requires npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # No NODE_AUTH_TOKEN: npm authenticates via the OIDC trusted publisher.
      # access comes from package.json publishConfig; provenance is generated automatically.
      - run: npm publish
